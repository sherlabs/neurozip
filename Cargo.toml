[package]
name = "neurozip"
version = "0.1.0"
edition = "2024"
description = "Experimental lossless compressor: deterministic online-learned prediction + integer range coding"
license = "MIT OR Apache-2.0"

[lib]
name = "neurozip"
path = "src/lib.rs"

[[bin]]
name = "neurozip"
path = "src/main.rs"

[dependencies]
sha2 = "0.11.1"

[dev-dependencies]
proptest = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Overflow checks are off here for speed (they cost about a third of the
# throughput). All arithmetic is bounded by construction, and the test suite
# runs in the dev profile, where overflow checks are on and would panic.
overflow-checks = false

[profile.test]
opt-level = 2
